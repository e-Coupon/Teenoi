name: Swensen hard standard lock

on:
  push:
    paths:
      - 'Swensen/**'
      - '.github/workflows/swensen-hard-lock.yml'
      - 'SWENSEN_COUPON_CREATION_METHOD_LOCKED.md'
  pull_request:
    paths:
      - 'Swensen/**'
      - '.github/workflows/swensen-hard-lock.yml'
      - 'SWENSEN_COUPON_CREATION_METHOD_LOCKED.md'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce Swensen locked standard
        shell: bash
        run: |
          set -euo pipefail

          REF_PATH='Swensen/026C0D9C2D840/(1)/index.html'
          REF_SHA='d0f1803d9fda3ae84c17c4817f499068d0a21215'
          STANDARD_PATH='Swensen/SWENSEN_STANDARD_LOCKED.md'
          STANDARD_SHA='db9aae6c5c91d38997975391458647ec8b2ed14d'
          LOCK_WORKFLOW='.github/workflows/swensen-hard-lock.yml'
          METHOD_PATH='SWENSEN_COUPON_CREATION_METHOD_LOCKED.md'
          METHOD_SHA='3023b998a84291d63cb06fd70804b8c596a83ebe'

          test "$(git rev-parse "HEAD:$REF_PATH")" = "$REF_SHA"
          test "$(git rev-parse "HEAD:$STANDARD_PATH")" = "$STANDARD_SHA"
          test "$(git rev-parse "HEAD:$METHOD_PATH")" = "$METHOD_SHA"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            diff="$(git diff --name-status "$BASE" "$HEAD")"
          else
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              diff="$(git diff --name-status HEAD^ HEAD)"
            else
              diff="$(git diff-tree --root --no-commit-id --name-status HEAD)"
            fi
          fi

          printf '%s\n' "$diff"

          added="$(printf '%s\n' "$diff" | awk -F '\t' '$1 == "A" && $2 ~ /^Swensen\/[^/]+\/\(1\)\/index\.html$/ {print $2}')"
          if [ -n "$added" ]; then
            export SWENSEN_PATHS="$added"
            python - <<'PY'
          import base64
          import os
          import re
          import struct
          from pathlib import Path
          
          ROOT = Path.cwd()
          REFERENCE = ROOT / "Swensen/026C0D9C2D840/(1)/index.html"
          BARCODE_TAG = re.compile(r'<img\s+id=["\']barcode["\'][^>]*>', re.I | re.S)
          SRC_RE = re.compile(r'\bsrc=["\']([^"\']+)["\']', re.I)
          ALT_RE = re.compile(r'\balt=["\']([^"\']*)["\']', re.I)
          TITLE_RE = re.compile(r"(<title>[^<]*?—\s*)[^<]+(\s*</title>)", re.I | re.S)
          CODE_RE = re.compile(r'(<div\s+id=["\']code["\']\s*>)[^<]*(</div>)', re.I | re.S)
          KEY_RE = re.compile(r"const\s+COUPON_KEY\s*=\s*['\"]swensen_[^'\"]+_used_v1['\"]", re.I)
          
          def fail(path, msg):
              raise SystemExit(f"FAIL {path}: {msg}")
          
          def canonicalize(html):
              html = TITLE_RE.sub(r"\g<1>__CODE__\g<2>", html, count=1)
              html = CODE_RE.sub(r"\g<1>__CODE__\g<2>", html, count=1)
              def barcode_repl(match):
                  tag = match.group(0)
                  tag = SRC_RE.sub('src="__BARCODE__"', tag, count=1)
                  tag = ALT_RE.sub('alt="Barcode __CODE__"', tag, count=1)
                  return tag
              html = BARCODE_TAG.sub(barcode_repl, html, count=1)
              html = KEY_RE.sub("const COUPON_KEY='swensen___CODE___used_v1'", html, count=1)
              return html
          
          reference_html = REFERENCE.read_text(encoding="utf-8")
          
          for raw in os.environ.get("SWENSEN_PATHS", "").splitlines():
              raw = raw.strip()
              if not raw:
                  continue
          
              path = (ROOT / raw).resolve()
              rel = path.relative_to(ROOT)
              parts = rel.parts
              if len(parts) != 4 or parts[0] != "Swensen" or parts[2] != "(1)" or parts[3] != "index.html":
                  fail(rel, "path must be Swensen/<CODE>/(1)/index.html")
          
              code = parts[1].upper()
              if not re.fullmatch(r"[0-9A-Z]+", code):
                  fail(rel, "invalid coupon code")
          
              html = path.read_text(encoding="utf-8")
          
              visible = CODE_RE.search(html)
              if not visible or re.sub(r"\s+", "", visible.group(0).split(">", 1)[1].split("<", 1)[0]) != code:
                  fail(rel, "visible coupon code mismatch")
          
              title = re.search(r"<title>([^<]*)</title>", html, re.I)
              if not title or code not in title.group(1):
                  fail(rel, "title does not contain the exact coupon code")
          
              key = KEY_RE.search(html)
              if not key or code.lower() not in key.group(0).lower():
                  fail(rel, "COUPON_KEY does not contain the exact lowercase coupon code")
          
              tag_match = BARCODE_TAG.search(html)
              if not tag_match:
                  fail(rel, "missing #barcode")
          
              tag = tag_match.group(0)
              src_match = SRC_RE.search(tag)
              alt_match = ALT_RE.search(tag)
              if not src_match:
                  fail(rel, "#barcode has no src")
          
              src = src_match.group(1).strip()
              prefix = "data:image/png;base64,"
              if not src.startswith(prefix) or src.count(prefix) != 1:
                  fail(rel, "barcode must be an embedded PNG Base64 data URI; external URLs and SVG are forbidden")
          
              if not alt_match or alt_match.group(1).strip() != f"Barcode {code}":
                  fail(rel, "barcode alt text mismatch")
          
              payload = base64.b64decode(src[len(prefix):], validate=True)
              if payload[:8] != b"\x89PNG\r\n\x1a\n" or len(payload) < 24:
                  fail(rel, "barcode payload is not a valid PNG")
          
              width, height = struct.unpack(">II", payload[16:24])
              if (width, height) != (594, 120):
                  fail(rel, f"barcode PNG is {width}x{height}; required 594x120")
          
              if canonicalize(html) != canonicalize(reference_html):
                  fail(rel, "UI/layout/JavaScript differs from immutable reference after normalizing only coupon data")
          
              print(f"PASS {rel}: locked Swensen standard verified")
          PY
          fi

          while IFS=$'\t' read -r status path rest; do
            [ -n "$path" ] || continue

            case "$path" in
              "$REF_PATH"|"$STANDARD_PATH"|"$LOCK_WORKFLOW"|"$METHOD_PATH")
                echo "Protected file touched: $path"
                if [ "$path" = "$LOCK_WORKFLOW" ] && [ "$status" = "M" ] && [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$(git log -1 --pretty=%s)" = "Repair Swensen hard lock" ]; then
                  echo "Allowing one-time repair of the hard-lock workflow."
                else
                  case "$status" in
                    A) ;;
                    *) echo "Protected files cannot be modified, renamed, or deleted."; exit 1 ;;
                  esac
                fi
                ;;
            esac

            case "$status" in
              M|D|R*|C*)
                case "$path" in
                  Swensen/*)
                    echo "Existing Swensen content may not be modified/deleted/renamed: $status $path"
                    exit 1
                    ;;
                esac
                ;;
            esac

            case "$path" in
              Swensen/*)
                case "$status" in
                  A)
                    if ! printf '%s\n' "$path" | grep -Eq '^Swensen/[^/]+/\([0-9]+\)/index\.html$'; then
                      echo "Only a new code-specific Swensen index may be added: $path"
                      exit 1
                    fi
                    code="$(printf '%s\n' "$path" | sed -E 's#^Swensen/([^/]+)/\([0-9]+\)/index\.html$#\1#')"
                    if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
                      if git cat-file -e "$BASE:Swensen/$code/(1)/index.html" 2>/dev/null; then
                        echo "Coupon already existed in base and cannot be overwritten: $code"
                        exit 1
                      fi
                    elif git rev-parse HEAD^ >/dev/null 2>&1; then
                      if git cat-file -e "HEAD^:Swensen/$code/(1)/index.html" 2>/dev/null; then
                        echo "Coupon already existed before this commit and cannot be overwritten: $code"
                        exit 1
                      fi
                    fi
                    ;;
                esac
                ;;
            esac
          done <<< "$diff"

          echo "Swensen hard standard lock passed."
