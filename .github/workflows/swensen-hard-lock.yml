name: Swensen hard standard lock

on:
  push:
    paths:
      - 'Swensen/**'
      - '.github/workflows/swensen-hard-lock.yml'
  pull_request:
    paths:
      - 'Swensen/**'
      - '.github/workflows/swensen-hard-lock.yml'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install barcode validation dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir opencv-python-headless numpy

      - name: Enforce immutable reference and validate every new Swensen page
        shell: bash
        run: |
          set -euo pipefail

          REF_PATH='Swensen/026C0D9C2D840/(1)/index.html'
          REF_SHA='d0f1803d9fda3ae84c17c4817f499068d0a21215'
          STANDARD_PATH='Swensen/SWENSEN_STANDARD_LOCKED.md'
          STANDARD_SHA='db9aae6c5c91d38997975391458647ec8b2ed14d'
          LOCK_WORKFLOW='.github/workflows/swensen-hard-lock.yml'

          actual_ref_sha="$(git rev-parse "HEAD:$REF_PATH")"
          actual_standard_sha="$(git rev-parse "HEAD:$STANDARD_PATH")"

          test "$actual_ref_sha" = "$REF_SHA"
          test "$actual_standard_sha" = "$STANDARD_SHA"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            diff="$(git diff --name-status "$BASE" "$HEAD")"
          else
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              diff="$(git diff --name-status HEAD^ HEAD)"
            else
              diff="$(git diff-tree --root --no-commit-id --name-status HEAD)"
            fi
          fi

          printf '%s\n' "$diff"

          added="$(printf '%s\n' "$diff" | awk -F '\t' '$1 == "A" && $2 ~ /^Swensen\/[^/]+\/\(1\)\/index\.html$/ {print $2}')"
          if [ -n "$added" ]; then
            export SWENSEN_PATHS="$added"
            python - <<'PY'
import base64
import os
import re
import sys
from pathlib import Path

import cv2
import numpy as np

ROOT = Path.cwd()
REFERENCE = ROOT / "Swensen/026C0D9C2D840/(1)/index.html"
BARCODE_TAG = re.compile(r'<img\s+id=["\']barcode["\'][^>]*>', re.I | re.S)
SRC_RE = re.compile(r'\bsrc=["\']([^"\']+)["\']', re.I)
ALT_RE = re.compile(r'\balt=["\']([^"\']*)["\']', re.I)
KEY_RE = re.compile(r"const\s+COUPON_KEY\s*=\s*['\"]swensen_[^'\"]+_used_v1['\"]", re.I)

def fail(path, msg):
    raise RuntimeError(f"{path}: {msg}")

def canonicalize(html):
    html = re.sub(r"(<title>[^<]*?—\s*)[^<]+(\s*</title>)",
                  r"\g<1>__CODE__\g<2>", html, count=1, flags=re.I | re.S)
    html = re.sub(r'(<div\s+id=["\']code["\']\s*>)[^<]*(</div>)',
                  r"\g<1>__CODE__\g<2>", html, count=1, flags=re.I | re.S)

    def barcode_repl(m):
        tag = m.group(0)
        tag = SRC_RE.sub('src="__BARCODE__"', tag, count=1)
        tag = ALT_RE.sub('alt="Barcode __CODE__"', tag, count=1)
        return tag

    html = BARCODE_TAG.sub(barcode_repl, html, count=1)
    html = KEY_RE.sub("const COUPON_KEY='swensen___CODE___used_v1'", html, count=1)
    return html

def decode_code(path, payload, expected):
    if payload[:8] != b"\x89PNG\r\n\x1a\n":
        fail(path, "barcode is not a PNG file")

    image = cv2.imdecode(np.frombuffer(payload, dtype=np.uint8), cv2.IMREAD_COLOR)
    if image is None:
        fail(path, "barcode PNG cannot be decoded")
    h, w = image.shape[:2]
    if (w, h) != (594, 120):
        fail(path, f"barcode size is {w}x{h}; required 594x120")

    detector = cv2.barcode.BarcodeDetector()
    decoded = []
    types = []

    try:
        result = detector.detectAndDecode(image)
        if len(result) == 4:
            ok, values, kinds, _ = result
            if ok and values:
                decoded.extend([values] if isinstance(values, str) else [v for v in values if v])
                if kinds:
                    types.extend(kinds)
    except Exception:
        pass

    if not decoded:
        try:
            result = detector.detectAndDecodeMulti(image)
            if len(result) >= 2 and result[0] and result[1]:
                decoded.extend(v for v in result[1] if v)
                if len(result) >= 3 and result[2]:
                    types.extend(result[2])
        except Exception:
            pass

    decoded = [v.strip() for v in decoded if v and v.strip()]
    if expected not in decoded:
        fail(path, f"barcode does not decode exactly to {expected!r}; decoded={decoded!r}")

    if types:
        normalized = {re.sub(r"[^A-Z0-9]", "", t.upper()) for t in types if t}
        if not any("CODE128" in t for t in normalized):
            fail(path, f"barcode type is not Code 128: {sorted(normalized)!r}")

for raw in os.environ.get("SWENSEN_PATHS", "").splitlines():
    if not raw.strip():
        continue

    path = (ROOT / raw.strip()).resolve()
    try:
        rel = path.relative_to(ROOT)
    except ValueError:
        fail(raw, "path is outside the repository")

    parts = rel.parts
    if len(parts) != 4 or parts[0] != "Swensen" or parts[2] != "(1)" or parts[3] != "index.html":
        fail(rel, "new production path must be Swensen/<CODE>/(1)/index.html")

    code = parts[1].upper()
    if not re.fullmatch(r"[0-9A-Z]+", code):
        fail(rel, "invalid Swensen coupon code")

    html = path.read_text(encoding="utf-8")

    code_match = re.search(r'<div\s+id=["\']code["\']\s*>([^<]*)</div>', html, re.I)
    if not code_match or code_match.group(1).strip() != code:
        fail(rel, "visible coupon code does not exactly match directory code")

    title_match = re.search(r"<title>([^<]*)</title>", html, re.I)
    if not title_match or code not in title_match.group(1):
        fail(rel, "title does not contain the exact coupon code")

    key_match = KEY_RE.search(html)
    if not key_match or code.lower() not in key_match.group(0).lower():
        fail(rel, "COUPON_KEY does not contain the exact lowercase coupon code")

    tag_match = BARCODE_TAG.search(html)
    if not tag_match:
        fail(rel, "missing #barcode")

    tag = tag_match.group(0)
    src_match = SRC_RE.search(tag)
    if not src_match:
        fail(rel, "#barcode has no src")
    src = src_match.group(1).strip()
    prefix = "data:image/png;base64,"
    if not src.startswith(prefix) or src.count(prefix) != 1:
        fail(rel, "barcode must be an embedded PNG Base64 data URI; external barcode URLs are forbidden")

    alt_match = ALT_RE.search(tag)
    if not alt_match or alt_match.group(1).strip() != f"Barcode {code}":
        fail(rel, "barcode alt text does not exactly match the coupon code")

    try:
        payload = base64.b64decode(src[len(prefix):], validate=True)
    except Exception as exc:
        fail(rel, f"barcode Base64 is invalid: {exc}")

    decode_code(rel, payload, code)

    reference_html = REFERENCE.read_text(encoding="utf-8")
    if canonicalize(html) != canonicalize(reference_html):
        fail(rel, "UI/layout/JavaScript differs from the immutable reference after normalizing allowed coupon data")

    print(f"PASS {rel}: locked Swensen standard verified")
PY
          fi

          while IFS=$'\t' read -r status path rest; do
            [ -n "$path" ] || continue

            case "$path" in
              "$REF_PATH"|
              "$STANDARD_PATH"|
              "$LOCK_WORKFLOW")
                echo "Protected file touched: $path"
                case "$status" in
                  A) ;;
                  *) echo "Protected files cannot be modified, renamed, or deleted."; exit 1 ;;
                esac
                ;;
            esac

            case "$status" in
              M|D|R*|C*)
                case "$path" in
                  Swensen/*)
                    echo "Existing Swensen content may not be modified/deleted/renamed: $status $path"
                    exit 1
                    ;;
                esac
                ;;
            esac

            case "$path" in
              Swensen/*)
                case "$status" in
                  A)
                    if ! printf '%s\n' "$path" | grep -Eq '^Swensen/[^/]+/\([0-9]+\)/index\.html$'; then
                      echo "Only code-specific Swensen coupon index files may be added: $path"
                      exit 1
                    fi
                    code="$(printf '%s\n' "$path" | sed -E 's#^Swensen/([^/]+)/\([0-9]+\)/index\.html#\1#')"
                    if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
                      if git cat-file -e "$BASE:Swensen/$code/(1)/index.html" 2>/dev/null; then
                        echo "Coupon already existed in base and cannot be overwritten: $code"
                        exit 1
                      fi
                    elif git rev-parse HEAD^ >/dev/null 2>&1; then
                      if git cat-file -e "HEAD^:Swensen/$code/(1)/index.html" 2>/dev/null; then
                        echo "Coupon already existed before this commit and cannot be overwritten: $code"
                        exit 1
                      fi
                    fi
                    ;;
                esac
                ;;
            esac
          done <<< "$diff"

          echo "Swensen hard standard lock passed."
