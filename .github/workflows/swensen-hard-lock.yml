name: Swensen coupon barcode check

on:
  push:
    paths:
      - 'Swensen/**'
      - '.github/workflows/swensen-hard-lock.yml'
      - 'SWENSEN_COUPON_CREATION_METHOD_LOCKED.md'

permissions:
  contents: read

jobs:
  verify-barcode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify newly added coupon barcodes
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "${BEFORE}" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            diff="$(git diff-tree --root --no-commit-id --name-status "${AFTER}")"
          else
            diff="$(git diff --name-status "${BEFORE}" "${AFTER}")"
          fi

          added="$(printf '%s\n' "${diff}" | awk -F '\t' '$1 == "A" && $2 ~ /^Swensen\/[^/]+\/\(1\)\/index\.html$/ {print $2}')"

          if [ -z "${added}" ]; then
            echo "No new Swensen coupon to verify."
            exit 0
          fi

          python -m pip install --disable-pip-version-check -q zxing-cpp pillow

          export SWENSEN_PATHS="${added}"
          python - <<'PY'
          import base64
          import html
          import os
          import re
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          import zxingcpp

          TAG_RE = re.compile(r'<img\b[^>]*\bid=["\']barcode["\'][^>]*>', re.I | re.S)
          SRC_RE = re.compile(r'\bsrc=["\'](data:image/png;base64,[^"\']+)["\']', re.I)

          for raw in os.environ["SWENSEN_PATHS"].splitlines():
              raw = raw.strip()
              if not raw:
                  continue

              path = Path(raw)
              code = path.parts[1].upper()
              page = path.read_text(encoding="utf-8")

              tag = TAG_RE.search(page)
              if not tag:
                  raise SystemExit(f"FAIL {raw}: #barcode not found")

              src = SRC_RE.search(tag.group(0))
              if not src:
                  raise SystemExit(f"FAIL {raw}: embedded PNG barcode not found")

              payload = base64.b64decode(src.group(1).split(",", 1)[1], validate=True)
              image = Image.open(BytesIO(payload)).convert("RGB")

              results = zxingcpp.read_barcodes(image)
              decoded = [r.text for r in results if getattr(r, "format", None).name == "Code128"]

              if not decoded:
                  raise SystemExit(f"FAIL {raw}: barcode did not decode as Code 128")
              if code not in decoded:
                  raise SystemExit(f"FAIL {raw}: decoded={decoded!r}, expected={code!r}")

              print(f"PASS {raw}: scanned={code}")
          PY

          echo "Swensen barcode verification passed."
