name: Guard Swensen standalone outputs

on:
  push:
    paths:
      - 'Swensen/**'
      - 'SwensenSystem/**'
      - '.github/workflows/swensen-standalone.yml'
      - '.github/workflows/guard-swensen-standalone.yml'
  pull_request:
    paths:
      - 'Swensen/**'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject direct generated Swensen page edits
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          else
            changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          fi

          generated="$(printf '%s\n' "$changed" | grep -E '^Swensen/[A-Z0-9]{6,32}/\([0-9]+\)/index\.html$' || true)"
          if [ -n "$generated" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Generated Swensen pages must be produced by the standalone Swensen system."
              echo "$generated"
              exit 1
            fi

            message="$(git log -1 --pretty=%s)"
            if [ "$message" != "Generate Swensen coupon(s) from standalone system" ]; then
              echo "Direct Swensen output modification detected: $message"
              echo "$generated"
              exit 1
            fi
          fi

          echo "Swensen standalone write guard passed."
