name: Guard Teenoi coupon writes

on:
  push:
    paths:
      - 'MK*/(3)/index.html'
      - 'tools/generate_coupon.py'
      - '.github/workflows/generate-coupon.yml'
      - '.github/workflows/guard-coupon-writes.yml'
  pull_request:
    paths:
      - 'MK*/(3)/index.html'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject direct coupon-page edits
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Coupon pages are generated artifacts. Submit a generator request instead of editing them directly."
            if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -E '^MK[0-9]+/\(3\)/index\.html$'; then
              exit 1
            fi
            exit 0
          fi

          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          if printf '%s\n' "$changed" | grep -E '^MK[0-9]+/\(3\)/index\.html$' >/tmp/coupon-changes.txt; then
            message="$(git log -1 --pretty=%s)"
            if [ "$message" != "Generate Teenoi coupon(s) from Master" ]; then
              echo "Direct coupon-page modification detected in commit: $message"
              cat /tmp/coupon-changes.txt
              exit 1
            fi
          fi
          echo "Coupon write guard passed."
