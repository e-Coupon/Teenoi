name: Validate Teenoi coupons

on:
  push:
    paths:
      - 'MK*/**'
      - 'tools/validate_coupons.py'
      - '.github/workflows/validate-coupons.yml'
  pull_request:
    paths:
      - 'MK*/**'
      - 'tools/validate_coupons.py'
      - '.github/workflows/validate-coupons.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QR decoder
        run: python -m pip install --disable-pip-version-check --no-cache-dir opencv-python-headless numpy

      - name: Validate coupon HTML and QR payloads
        run: python tools/validate_coupons.py
