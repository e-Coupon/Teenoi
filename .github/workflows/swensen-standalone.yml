name: Swensen standalone coupon system

on:
  push:
    paths:
      - 'SwensenSystem/requests/*.request'
      - 'SwensenSystem/generate_swensen.py'
      - 'SwensenSystem/validate_swensen.py'
      - 'SwensenSystem/_MASTER/index.html'
      - '.github/workflows/swensen-standalone.yml'
  workflow_dispatch:

concurrency:
  group: swensen-standalone-generator
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Code 128 validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0
          python -m pip install --disable-pip-version-check --no-cache-dir python-barcode pillow pyzbar

      - name: Standalone generator self-test
        run: |
          python - <<'PY'
          from pathlib import Path
          from SwensenSystem.generate_swensen import MASTER, transform_master, decode_barcode_from_html
          html = transform_master(MASTER.read_text(encoding="utf-8"), "SWTEST000003")
          decode_barcode_from_html(html, "SWTEST000003")
          assert "teenoi_" not in html.lower()
          print("Swensen standalone generator self-test passed.")
          PY

      - name: Generate queued Swensen coupons
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          requests=(SwensenSystem/requests/*.request)
          if [ "${#requests[@]}" -eq 0 ]; then
            echo "No pending Swensen requests."
            exit 0
          fi

          for request in "${requests[@]}"; do
            filename="$(basename "$request")"
            code="${filename%.request}"
            requested="$(tr -d '[:space:]' < "$request")"
            if [ "$requested" != "$code" ]; then
              echo "Request/content mismatch: $request contains '$requested', filename says '$code'"
              exit 1
            fi

            if [ -d "Swensen/$code" ]; then
              echo "Coupon already exists: Swensen/$code"
              rm -f "$request"
              continue
            fi

            python -m SwensenSystem.generate_swensen "$code"
            rm -f "$request"
          done

      - name: Validate all Swensen coupons
        run: python -m SwensenSystem.validate_swensen

      - name: Commit standalone Swensen output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "swensen-standalone-generator"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Swensen SwensenSystem
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Generate Swensen coupon(s) from standalone system"
          git push
