name: Build Makro PRO Bot APK

on:
  push:
    branches: [makro-pro-bot]
    paths:
      - "MakroAutomation/**"
      - ".github/workflows/build-makro-bot-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAKRO_SIGNING_KEYSTORE: ${{ runner.temp }}/makro-signing/makro-debug.keystore
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/makro-signing/makro-debug.keystore
          key: makro-pro-bot-stable-signing-v1

      - name: Create stable debug signing key when missing
        shell: bash
        run: |
          mkdir -p "$(dirname "$MAKRO_SIGNING_KEYSTORE")"
          if [ ! -s "$MAKRO_SIGNING_KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$MAKRO_SIGNING_KEYSTORE" \
              -storetype JKS \
              -storepass android \
              -keypass android \
              -alias makro-pro-bot-debug \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Makro PRO Bot, O=e-Coupon, C=TH"
          fi
          keytool -list -keystore "$MAKRO_SIGNING_KEYSTORE" -storepass android -alias makro-pro-bot-debug

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle -p MakroAutomation :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: makro-pro-bot-debug-apk
          path: MakroAutomation/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
