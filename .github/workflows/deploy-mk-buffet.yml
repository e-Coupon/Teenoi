name: Deploy MK Buffet Subscription to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "MK/BuffetSubscriptionDirect/index.html"
      - ".github/workflows/deploy-mk-buffet.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-mk-buffet"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site/MK/BuffetSubscriptionDirect
          cp MK/BuffetSubscriptionDirect/index.html _site/MK/BuffetSubscriptionDirect/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
