name: Generate Swensen coupon

on:
  push:
    paths:
      - 'Swensen/coupon-requests/*.request'
  workflow_dispatch:

concurrency:
  group: swensen-coupon-generator
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0
          python -m pip install --disable-pip-version-check --no-cache-dir python-barcode pillow pyzbar

      - name: Self-test generator from Master
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, ".")
          from tools.generate_swensen import MASTER, transform_master, decode_barcode_from_html
          html = transform_master(MASTER.read_text(encoding="utf-8"), "SWTEST000001")
          decode_barcode_from_html(html, "SWTEST000001")
          print("Swensen generator self-test passed.")
          PY

      - name: Generate requested coupons
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(Swensen/coupon-requests/*.request)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No pending Swensen requests."
            exit 0
          fi

          for request in "${files[@]}"; do
            filename="$(basename "$request")"
            code="${filename%.request}"
            requested="$(tr -d '[:space:]' < "$request")"
            if [ "$requested" != "$code" ]; then
              echo "Request/content mismatch: $request contains '$requested', filename says '$code'"
              exit 1
            fi
            python tools/generate_swensen.py "$code"
            rm -f "$request"
          done

      - name: Validate all Swensen coupons
        run: python tools/validate_swensen.py

      - name: Commit generated coupons
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "swensen-coupon-generator"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Swensen tools/generate_swensen.py tools/validate_swensen.py
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Generate Swensen coupon(s) from Master"
          git push
