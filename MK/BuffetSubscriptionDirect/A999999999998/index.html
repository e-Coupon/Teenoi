<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MK Buffet Coupon</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#fff}
#stage{position:relative;width:min(100vw,790px);height:100vh;margin:0 auto;overflow:hidden;background:#fff}
#demo{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#fff}
#overlay{position:absolute;inset:0;pointer-events:none;display:none}
.qr-mask{position:absolute;left:23.90625%;top:35.6816%;width:52.1354%;aspect-ratio:1;background:#fff}
.qr{position:absolute;left:23.90625%;top:35.6816%;width:52.1354%;height:auto;display:block}
.code{position:absolute;left:0;top:65.66%;width:100%;text-align:center;font-family:Arial,sans-serif;font-size:clamp(25px,3.95vw,31px);line-height:1;font-weight:400;color:#a6a6a6;letter-spacing:0}
</style>
</head>
<body>
<div id="stage">
  <iframe id="demo" src="../" title="MK Buffet Subscription Flow"></iframe>
  <div id="overlay" aria-hidden="true">
    <div class="qr-mask"></div>
    <img id="qr" class="qr" alt="">
    <div id="code" class="code"></div>
  </div>
</div>
<script>
const CODE = "A999999999998";
const frame = document.getElementById('demo');
const stage = document.getElementById('stage');
const overlay = document.getElementById('overlay');
const qr = document.getElementById('qr');
const code = document.getElementById('code');

qr.src = "https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&margin=0&data=" + encodeURIComponent(CODE);
qr.alt = "QR Code " + CODE;
code.textContent = CODE;

function sync(){
  let hash = "";
  try { hash = frame.contentWindow.location.hash || ""; } catch(e) {}
  overlay.style.display = hash === "#page3" ? "block" : "none";
  try {
    const screen = frame.contentDocument && frame.contentDocument.querySelector(".screen");
    if (screen) {
      stage.style.height = screen.getBoundingClientRect().height + "px";
    }
  } catch(e) {}
}
frame.addEventListener("load", sync);
setInterval(sync, 150);
sync();
</script>
</body>
</html>
<!-- pages-build-trigger -->
