<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MK Buffet Coupon</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#fff}
#stage{position:relative;width:min(100vw,790px);height:100vh;margin:0 auto;overflow:hidden;background:#fff}
#demo{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#fff}
#overlay{position:absolute;inset:0;pointer-events:none;display:none}
.mask{position:absolute;left:22.8%;top:34.1%;width:54.4%;height:34.5%;background:#fff}
.qr{position:absolute;left:23.8%;top:35.0%;width:52.4%;height:auto;display:block}
.code{position:absolute;left:25%;top:64.8%;width:50%;text-align:center;font-family:Arial,sans-serif;font-size:2.65vw;line-height:1.1;font-weight:400;color:#a6a6a6;letter-spacing:0}
@media (min-width:790px){
  .code{font-size:20.9px}
}
</style>
</head>
<body>
<div id="stage">
  <iframe id="demo" src="../" title="MK Buffet Subscription Flow"></iframe>
  <div id="overlay" aria-hidden="true">
    <div class="mask"></div>
    <img id="qr" class="qr" alt="">
    <div id="code" class="code"></div>
  </div>
</div>
<script>
const CODE = "A999999999998";
const frame = document.getElementById('demo');
const overlay = document.getElementById('overlay');
const qr = document.getElementById('qr');
const code = document.getElementById('code');
const enc = encodeURIComponent(CODE);
qr.src = "https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&margin=0&data=" + enc;
qr.alt = "QR Code " + CODE;
code.textContent = CODE;

function sync(){
  let hash = "";
  try { hash = frame.contentWindow.location.hash || ""; } catch(e) {}
  overlay.style.display = hash === "#page3" ? "block" : "none";
}
frame.addEventListener("load", sync);
setInterval(sync, 150);
sync();
</script>
</body>
</html>
