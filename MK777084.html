<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ตี๋น้อย e-Coupon</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;font-family:Arial,sans-serif;display:flex;justify-content:center;min-height:100vh}
.card{width:min(430px,100%);min-height:100vh;background:#fff;padding:28px 22px;text-align:center}
h1{margin:10px 0 6px;font-size:30px}p{color:#666;margin:0 0 22px}.qr{display:flex;justify-content:center;margin:24px 0}
.code{font-size:28px;font-weight:700;letter-spacing:2px;margin-top:18px}.note{font-size:13px;color:#777;margin-top:14px}
</style></head><body><main class="card"><h1>ตี๋น้อย</h1><p>e-Coupon</p><div id="qrcode" class="qr"></div><div id="code" class="code"></div><div class="note">QR นี้เข้ารหัสด้วยรหัสคูปองโดยตรง</div></main>
<script>
const code=location.pathname.split('/').pop().replace(/\.html$/,'').toUpperCase();
document.getElementById('code').textContent=code;
new QRCode(document.getElementById('qrcode'),{text:code,width:280,height:280,correctLevel:QRCode.CorrectLevel.M});
</script></body></html>
