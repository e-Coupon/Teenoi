<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body {
    margin:0; width:100%; height:100%; overflow:hidden;
    background:#f3f3f3; font-family:Arial,"Noto Sans Thai",sans-serif;
  }
  #app { position:fixed; inset:0; overflow:hidden; background:#fff; }

  .screen {
    position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
    background:#fff; -webkit-overflow-scrolling:touch;
    transition:opacity .18s ease, transform .18s ease;
  }
  .screen.hidden {
    opacity:0; pointer-events:none; transform:scale(.992);
  }
  .bg {
    display:block; width:100%; height:auto;
    user-select:none; -webkit-user-drag:none;
  }

  /* Only this arrow has pointer/touch interaction. */
  #arrow {
    position:absolute;
    left:12.1vw; top:76.0vw;
    width:18vw; height:18vw; max-width:128px; max-height:128px;
    min-width:56px; min-height:56px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:#e31922;
    box-shadow:0 4px 10px rgba(0,0,0,.13);
    z-index:10;
    touch-action:none;
    user-select:none; -webkit-user-select:none;
    transition:left .16s ease, transform .16s ease;
  }
  #arrow.dragging { transition:none; transform:scale(1.02); cursor:grabbing; }
  #arrow span {
    color:#fff; font-size:clamp(44px,11.5vw,78px);
    line-height:1; font-weight:600;
    display:flex; align-items:center; justify-content:center;
    width:100%; height:100%; transform:translateY(-4px);
    pointer-events:none;
  }

  /* Page 2 — whole coupon remains visible and scrollable. */
  #page2wrap { position:relative; width:100%; min-height:100%; background:#fff; }
  #qr {
    position:absolute; left:24%; top:19.2%; width:52%; aspect-ratio:1/1;
    object-fit:contain; background:#fff; image-rendering:pixelated;
  }
  #code {
    position:absolute; left:0; right:0; top:43.4%;
    text-align:center; color:#000; font-weight:800;
    font-size:clamp(33px,6.9vw,53px);
    line-height:1; letter-spacing:0.6px;
    font-variant-numeric:tabular-nums;
  }
  /* Timer area — centered exactly on the coupon, like the Swensen's version. */
  /* Timer group is centered to the PINK BOX itself, not the whole page.
     The pink box in the source artwork spans about 50.4%–62.7% vertically,
     so its exact center is about 56.55%. */
  #timer-group {
    position:absolute; left:0; right:0; top:56.55%;
    transform:translateY(-50%);
    width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
  }
  #expire-label {
    width:90%;
    display:flex; align-items:center; justify-content:center;
    color:#e32127; font-weight:500;
    font-size:clamp(15px,3.0vw,22px);
    line-height:1; white-space:nowrap;
  }
  #timer {
    width:90%;
    margin-top:clamp(10px,1.7vw,14px);
    display:flex; align-items:center; justify-content:center;
    color:#e32127; font-weight:800;
    font-size:clamp(27px,6.9vw,51px);
    line-height:1; font-variant-numeric:tabular-nums;
  }

<script>
(() => {
  const arrow = document.getElementById('arrow');
  const page1 = document.getElementById('page1');
  const page2 = document.getElementById('page2');
  const timer = document.getElementById('timer');

  let dragging = false, opened = false;
  let startX = 0;
  let startLeftPx = 0;
  let remaining = 2 * 60 * 60;
  let timerStarted = false;

  function openCoupon() {
    if (opened) return;
    opened = true;
    page1.classList.add('hidden');
    page2.classList.remove('hidden');

    if (!timerStarted) {
      timerStarted = true;
      const tick = () => {
        const h = Math.floor(remaining / 3600);
        const m = Math.floor((remaining % 3600) / 60);
        const s = remaining % 60;
        timer.textContent =
          String(h).padStart(2,'0') + ':' +
          String(m).padStart(2,'0') + ':' +
          String(s).padStart(2,'0');
        if (remaining > 0) {
          remaining--;
          setTimeout(tick, 1000);
        }
      };
      tick();
    }
  }

  // Interaction starts ONLY when the user touches the arrow.
  arrow.addEventListener('pointerdown', (e) => {
    if (opened) return;
    dragging = true;
    startX = e.clientX;
    startLeftPx = arrow.getBoundingClientRect().left;
    arrow.classList.add('dragging');
    arrow.setPointerCapture?.(e.pointerId);
    e.preventDefault();
  });

  arrow.addEventListener('pointermove', (e) => {
    if (!dragging || opened) return;

    const dx = e.clientX - startX;
    const vw = window.innerWidth;
    const minLeft = vw * 0.08;
    const maxLeft = vw * 0.76;
    const next = Math.max(minLeft, Math.min(maxLeft, startLeftPx + dx));
    arrow.style.left = next + 'px';
    e.preventDefault();
  });

  const finishDrag = (e) => {
    if (!dragging || opened) return;
    dragging = false;
    arrow.classList.remove('dragging');

    const dx = e.clientX - startX;
    const threshold = Math.max(80, window.innerWidth * 0.25);

    if (dx >= threshold) {
      // The arrow follows the finger, then the whole screen changes.
      arrow.style.left = (window.innerWidth * 0.76) + 'px';
      setTimeout(openCoupon, 80);
    } else {
      arrow.style.left = '12.1vw';
    }
  };

  arrow.addEventListener('pointerup', finishDrag);
  arrow.addEventListener('pointercancel', finishDrag);

  // Absolutely no swipe handlers on the page itself.
  // There is no swipe-left/back action after the coupon opens.
})();
</script>
</body>
</html>
